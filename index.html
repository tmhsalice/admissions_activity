<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大明高級中學｜招生活動管理系統</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#02257F;--navylight:#1B3A93;--gold:#D4A017;--goldsoft:rgba(212,160,23,.14);
  --bg:#F6F8FB;--card:#FFFFFF;--hover:#F8FAFC;--track:#EEF2F6;
  --tx:#0F172A;--tx2:#475569;--mu:#64748B;--bd:#E5E7EB;
  --ok-bg:#ECFDF5;--ok-tx:#047857;--dg:#9E2A2F;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.03);
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,"Microsoft JhengHei","PingFang TC",sans-serif;-webkit-font-smoothing:antialiased}
body.app-on{padding-left:256px}
body.embed-on{padding:0!important;background:transparent}

/* 桌機左側導覽列（與招生工作手冊統一） */
header.side{background:var(--navy);color:#fff;position:fixed;left:0;top:0;bottom:0;width:256px;display:flex;flex-direction:column;z-index:20;overflow-y:auto}
.brand-box{padding:24px;border-bottom:1px solid var(--navylight)}
.brand-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brand-top img{width:44px;height:44px;object-fit:contain;flex:none}
.brand-note{font-size:10px;letter-spacing:.1em;color:rgba(212,160,23,.9);margin:0}
header.side h1{font-size:20px;font-weight:600;margin:0;line-height:1.35;color:#fff}
.en-title{display:inline-block;font-size:11px;letter-spacing:.2em;color:var(--gold);margin:6px 0 0;padding-bottom:8px;border-bottom:1px solid rgba(212,160,23,.4)}
.sys-sub{font-size:12px;color:rgba(255,255,255,.72);margin:8px 0 0}

nav.side-nav{display:flex;flex-direction:column;padding:8px 0}
nav.side-nav button{border:0;border-left:4px solid transparent;background:transparent;color:rgba(255,255,255,.82);padding:12px 24px;cursor:pointer;font:inherit;font-size:16px;text-align:left;transition:background .15s,color .15s}
nav.side-nav button:hover{background:var(--navylight);color:#fff}
nav.side-nav button.on{background:rgba(255,255,255,.1);border-left-color:var(--gold);color:#fff;font-weight:600}

.ft{margin-top:auto;padding:16px 24px;border-top:1px solid var(--navylight);font-size:12px;color:rgba(255,255,255,.78);line-height:1.7}
.ft-btn{display:inline-block;padding:5px 10px;font-size:12px;border-radius:6px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;text-decoration:none;margin-right:6px;margin-top:6px;transition:background .15s}
.ft-btn:hover{background:var(--navylight)}
.ft-copy{margin-top:12px;font-size:11px;color:rgba(255,255,255,.48);line-height:1.6}

/* 手機頂部列、抽屜、底部 5 分頁導覽 */
.m-top,.m-nav,.m-drawer-mask{display:none}

/* 主內容區 */
main{max-width:1320px;margin:0 auto;padding:28px 36px 48px}
body.embed-on main{max-width:none;padding:4px 2px 16px}
.page-hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
.sec{font-size:11px;letter-spacing:.15em;color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:4px}
h2.pt{margin:0;font-size:26px;font-weight:700;color:var(--tx)}
.yr-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:var(--radius-sm);padding:5px 12px}
.yr-box label{font-size:13px;color:var(--tx2);font-weight:600}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select,input{font:inherit;padding:7px 12px;border:1px solid var(--bd);border-radius:var(--radius-sm);background:var(--card);color:var(--tx)}
select:focus,input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,160,23,.2)}

.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:var(--radius-sm);cursor:pointer;font:inherit;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,opacity .15s}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:var(--navylight)}
.btn.ghost{background:#EFF6FF;color:var(--navy);border-color:transparent;font-size:13px;font-weight:600;padding:6px 12px}
.btn.ghost:hover{background:#DBEAFE}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.dg{color:var(--dg);border-color:#e5c3c5}
.btn.dg:hover{background:#fdf2f2}

/* 內嵌頁籤列 */
.embed-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.embed-tabs{display:inline-flex;background:var(--track);padding:4px;border-radius:10px;gap:4px}
.embed-tabs button{border:0;background:transparent;color:var(--tx2);padding:7px 16px;border-radius:7px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.embed-tabs button.on{background:var(--navy);color:#fff;box-shadow:0 1px 3px rgba(2,37,127,.25)}

/* 卡片與 KPI */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 24px;margin-bottom:18px}
.card-hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-title{margin:0;font-size:16px;font-weight:700;color:var(--tx)}
.card-sub{font-size:12px;color:var(--mu);margin-top:2px}
.kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:18px}
.kpi-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px}
.kpi-label{font-size:13px;color:var(--tx2);font-weight:500;margin-bottom:8px}
.kpi-val-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.kpi-num{font-size:32px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.15}
.kpi-sub{font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.status-pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok-tx)}

/* 類型分布與排行榜 */
.dist-list,.rank-list{display:flex;flex-direction:column;gap:4px}
.dist-row{display:grid;grid-template-columns:135px 1fr 44px;align-items:center;gap:14px;padding:8px 10px;border-radius:var(--radius-sm);transition:background .15s}
.dist-row:hover,.rank-row:hover{background:var(--hover)}
.dist-label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--tx)}
.dist-dot{width:9px;height:9px;border-radius:50%;flex:none}
.track{height:8px;background:var(--track);border-radius:999px;overflow:hidden}
.fil{height:100%;border-radius:999px;transition:width .25s ease}
.dist-cnt{text-align:right;font-size:14px;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums}
.dist-row.is-zero .dist-label,.dist-row.is-zero .dist-cnt{color:#94A3B8;font-weight:400}
.dist-row.is-zero .dist-dot{background:#CBD5E1!important}

.rank-row{display:grid;grid-template-columns:34px 115px 1fr 48px;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s}
.rank-badge{font-size:13px;font-weight:700;color:var(--mu);text-align:center;font-variant-numeric:tabular-nums}
.rank-row.top3 .rank-badge{color:var(--gold);background:var(--goldsoft);border-radius:6px;padding:2px 0}
.rank-name{font-size:14px;font-weight:600;color:var(--navy);text-decoration:underline;text-underline-offset:3px}
.rank-track{height:6px;background:var(--track);border-radius:999px;overflow:hidden}
.rank-fill{height:100%;background:#93C5FD;border-radius:999px}
.rank-row.top3 .rank-fill{background:var(--navy)}
.rank-cnt{text-align:right;font-size:14px;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums}

.mu{color:var(--mu);font-size:13px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 12px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--tx2);font-weight:600;cursor:pointer;background:var(--hover);border-bottom:2px solid rgba(212,160,23,.45)}
td.n,th.n{text-align:center;font-variant-numeric:tabular-nums}
.link{color:var(--navy);cursor:pointer;text-decoration:underline;font-weight:600}
.link:hover{color:var(--gold)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.tag{display:inline-block;padding:2px 9px;border-radius:5px;color:#fff;font-size:12px;font-weight:500}

/* 行事曆 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{text-align:center;color:var(--tx);font-size:14px;padding:9px 0;font-weight:600;background:var(--track);border-radius:6px}
.cal .d{min-height:106px;border:1px solid var(--bd);border-radius:8px;padding:7px;font-size:14px;background:#fff;overflow:hidden}
.cal .d b{display:inline-block;margin-bottom:4px;color:var(--tx);font-variant-numeric:tabular-nums}
.ev{display:block;color:#fff;border-radius:5px;padding:4px 7px;margin-top:4px;cursor:pointer;font-size:13px;font-weight:500;line-height:1.35;white-space:normal;word-break:break-word;transition:opacity .15s}
.ev:hover{opacity:.88}
.ev.x{opacity:.45;text-decoration:line-through}
.list-row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:14px}
.list-row:hover{background:var(--hover)}

/* 彈窗與手機底部滑出表單 */
.mask{position:fixed;inset:0;background:rgba(2,37,127,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:24px;max-width:620px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 16px 40px rgba(0,0,0,.22)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--navy)}
.login-box{background:#fff;border-radius:12px;padding:28px;max-width:380px;width:100%;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.login-box h2{margin:0 0 6px;font-size:20px;color:var(--navy)}
.loading{position:fixed;inset:0;background:rgba(246,248,251,.8);display:none;align-items:center;justify-content:center;z-index:80;font-weight:600;color:var(--navy);font-size:15px}
.loading.on{display:flex}

/* ===== 手機版面深度優化 ===== */
@media(max-width:860px){
  body.app-on{padding-left:0;padding-top:56px;padding-bottom:68px}
  header.side{display:none}
  .m-top{display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;height:56px;background:var(--navy);color:#fff;padding:0 14px;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .m-brand{display:flex;align-items:center;gap:10px}
  .m-brand img{width:30px;height:30px;object-fit:contain}
  .m-brand-t{font-size:15px;font-weight:600;line-height:1.2}
  .m-brand-s{font-size:10px;color:var(--gold);letter-spacing:.08em}
  .m-menu-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:6px 10px;font-size:16px;cursor:pointer}

  .m-drawer-mask{display:none;position:fixed;inset:0;background:rgba(2,37,127,.45);z-index:60}
  .m-drawer-mask.open{display:block}
  .m-drawer{position:fixed;top:0;right:0;bottom:0;width:260px;background:var(--navy);color:#fff;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:-4px 0 24px rgba(0,0,0,.25)}

  .m-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;height:62px;background:#fff;border-top:1px solid var(--bd);z-index:30;box-shadow:0 -2px 10px rgba(15,23,42,.06)}
  .m-nav button{border:0;border-top:3px solid transparent;background:transparent;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;cursor:pointer;padding:4px 0}
  .m-nav button svg{width:20px;height:20px}
  .m-nav button.on{color:var(--navy);border-top-color:var(--gold);font-weight:700}

  main{padding:16px 14px 24px}
  h2.pt{font-size:21px}
  .card{padding:16px}
  /* 2+1 便當格 KPI */
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi-card{padding:14px 16px}
  .kpi-card:nth-child(3){grid-column:1 / -1}
  .kpi-num{font-size:26px}
  /* 雙層緊湊長條圖 */
  .dist-row{grid-template-columns:1fr auto;gap:6px 10px;padding:8px 6px}
  .dist-row .track{grid-column:1 / -1;order:3}
  .rank-row{grid-template-columns:28px 1fr auto;gap:6px 8px;padding:8px 6px}
  .rank-row .rank-track{grid-column:2 / -1;order:3}

  .cal{gap:3px}
  .cal .d{min-height:66px;padding:4px;font-size:12px}
  .ev{font-size:11px;padding:2px 4px}

  /* 彈窗改為底部滑出 Bottom Sheet */
  .mask{align-items:flex-end;padding:0}
  .modal{border-radius:16px 16px 0 0;max-height:82vh;padding:20px 18px 28px}
}
</style>
</head>
<body>
<div id="ld" class="loading">資料同步中，請稍候...</div>
<div id="root"></div>
<div id="md"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbx5qTGHijprOKEd5xbaKzt4LOHKnFtq5PX9HzCbNWmpIza7EyFKkgtB6rvHjY-_cDAi/exec';
const GUIDE_URL = 'https://tmhsalice.github.io/admissions_guide/';
const LOGO_URL = 'https://tmhsalice.github.io/admissions_guide/logo.png';
const T = [
  ['說明會','#02257F'],['入班宣導','#2F8F45'],['博覽會','#D4A017'],['入校參訪','#7C3AED'],
  ['活動設攤','#9E2A2F'],['營隊體驗課程','#258DC4'],['介紹就讀','#65A30D'],['其他','#6B7280']
];

const EMBED_PARAM = new URLSearchParams(location.search).get('embed') || '';
const IS_EMBED = EMBED_PARAM === 'guide' || EMBED_PARAM === 'cal' || EMBED_PARAM === 'home';

const S = {
  staffId: localStorage.getItem('dm_staffId') || '',
  userName: localStorage.getItem('dm_staffName') || '',
  staff: [],
  activities: [],
  page: EMBED_PARAM === 'cal' ? 'cal' : 'home',
  embedTab: EMBED_PARAM === 'home' ? 'home' : 'cal',
  year: '115',
  m: new Date().getMonth(),
  calY: new Date().getFullYear(),
  view: 'cal',
  q: '',
  aq: '',
  rq: '',
  sort: 'total',
  dir: -1,
  hideZero: false,
  rankExpanded: false,
  drawerOpen: false
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const setLoad = on => $('#ld').classList.toggle('on', on);

function notifyHeight() {
  if (!IS_EMBED) return;
  requestAnimationFrame(() => {
    const h = document.documentElement.scrollHeight;
    window.parent.postMessage({ type: 'dmActivityHeight', height: h }, '*');
  });
}

async function api(action, payload = {}) {
  setLoad(true);
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ auth: { staffId: S.staffId }, action, payload })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '操作失敗');
    return json.data;
  } finally {
    setLoad(false);
  }
}

function renderBlocked(msg = '請先從「招生工作手冊」輸入員工編號登入後，再由左側選單進入本系統。') {
  document.body.classList.remove('app-on');
  $('#root').innerHTML = `
  <div class="login-wrap">
    <div class="login-box">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px">
        <img src="${LOGO_URL}" alt="" style="width:40px;height:40px;object-fit:contain" onerror="this.style.display='none'">
        <div>
          <div style="font-size:16px;font-weight:700;color:var(--navy)">大明高級中學</div>
          <div style="font-size:10px;letter-spacing:.15em;color:var(--gold)">TA-MING HIGH SCHOOL</div>
        </div>
      </div>
      <h2>招生活動管理系統</h2>
      <p style="color:var(--dg);font-size:14px;background:#fdf2f2;border:1px solid #f5c6cb;padding:10px 12px;border-radius:8px;margin:14px 0">${esc(msg)}</p>
      <a href="${GUIDE_URL}" class="btn pri" style="width:100%;padding:10px">前往招生工作手冊登入</a>
    </div>
  </div>`;
}

async function loadAll() {
  if (IS_EMBED) {
    try {
      const data = await api('getPublic');
      S.staff = data.staff || [];
      S.activities = data.activities || [];
      draw();
    } catch (err) {
      $('#root').innerHTML = `<div class="card"><p class="mu">資料載入失敗：${esc(err.message)}</p></div>`;
      notifyHeight();
    }
    return;
  }
  if (!S.staffId) return renderBlocked();
  try {
    const data = await api('getAll');
    S.staff = data.staff || [];
    S.activities = data.activities || [];
    draw();
  } catch (err) {
    renderBlocked('驗證未通過：' + err.message);
  }
}

const yrActs = () => S.activities.filter(a => String(a.year) === String(S.year));
const fa = a => (a.name + a.loc + (T[a.t]?.[0] || '')).toLowerCase().includes(S.aq.toLowerCase());
const cnt = () => S.staff.map(p => {
  const c = T.map(() => 0);
  yrActs().forEach(a => { if (!a.cx && a.ac.includes(p.id) && T[a.t]) c[a.t]++; });
  return { ...p, c, total: c.reduce((x, y) => x + y, 0) };
});

function getYears() {
  const set = new Set(['115', '116', '117', ...S.activities.map(a => String(a.year))]);
  return [...set].sort();
}

const ICONS = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  stats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>',
  manage: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  roster: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>'
};

function draw() {
  if (IS_EMBED) {
    document.body.classList.add('embed-on');
    document.body.classList.remove('app-on');
    $('#root').innerHTML = `
    <main>
      <div class="embed-bar">
        <div class="embed-tabs">
          <button class="${S.embedTab === 'cal' ? 'on' : ''}" onclick="S.embedTab='cal';draw()">📅 招生行事曆</button>
          <button class="${S.embedTab === 'home' ? 'on' : ''}" onclick="S.embedTab='home';draw()">📊 活動總覽</button>
        </div>
        <div class="yr-box">
          <label>學年度</label>
          <select onchange="S.year=this.value;draw()">
            ${getYears().map(y => `<option value="${y}" ${String(S.year) === y ? 'selected' : ''}>${y} 學年度</option>`).join('')}
          </select>
        </div>
      </div>
      <div id="content"></div>
    </main>`;
    $('#content').innerHTML = S.embedTab === 'cal' ? cal() : home();
    notifyHeight();
    return;
  }

  document.body.classList.add('app-on');
  const pages = [
    ['home', '首頁總覽'],
    ['cal', '招生行事曆'],
    ['stats', '參與統計'],
    ['manage', '活動管理'],
    ['roster', '教職員名冊']
  ];

function cal() {
  const y = S.calY, m = S.m;
  const f = new Date(y, m, 1).getDay(), n = new Date(y, m + 1, 0).getDate();
  const ds = d => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  let h = `
  <div class="bar">
    <button class="btn" onclick="shiftMonth(-1)">◀</button>
    <b style="font-size:18px;min-width:115px;text-align:center">${y} 年 ${m + 1} 月</b>
    <button class="btn" onclick="shiftMonth(1)">▶</button>
    <button class="btn ${S.view === 'cal' ? 'pri' : ''}" onclick="S.view='cal';draw()">月曆</button>
    <button class="btn ${S.view === 'list' ? 'pri' : ''}" onclick="S.view='list';draw()">列表</button>

  </div>`;

  if (S.view === 'cal') {
    h += '<div class="card cal">' + '日一二三四五六'.split('').map(x => `<div class="h">${x}</div>`).join('') + '<div></div>'.repeat(f);
    for (let d = 1; d <= n; d++) {
      const list = yrActs().filter(a => a.date === ds(d) && fa(a));
      h += `<div class="d"><b>${d}</b>${list.map(a => `<span class="ev ${a.cx ? 'x' : ''}" style="background:${T[a.t]?.[1] || '#6b7280'}" onclick="evt('${esc(a.id)}')">${esc(a.name)}</span>`).join('')}</div>`;
    }
    h += '</div>';
  } else {
    const ym = `${y}-${String(m + 1).padStart(2, '0')}`;
    const list = yrActs().filter(a => a.date.startsWith(ym) && fa(a)).sort((a, b) => a.date.localeCompare(b.date));

  }
  return h;
}

function parseExcelDate(val) {
  if (!val) return '';
  if (typeof val === 'number') {
    const d = new Date(Math.round((val - 25569) * 86400 * 1000));
    return d.toISOString().slice(0, 10);
  }
  const s = String(val).trim().replace(/\//g, '-');
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}` : s;
}

function matchStaffTokens(raw, unmatchedSet) {
  if (!raw) return [];
  const tokens = String(raw).split(/[、,，;；\/\n]+/).map(x => x.trim()).filter(Boolean);
  const ids = [];
  tokens.forEach(tk => {
    const clean = tk.replace(/\s+/g, '');
    const byId = S.staff.find(p => p.id === tk);
    if (byId) { if (!ids.includes(byId.id)) ids.push(byId.id); return; }
    const byName = S.staff.find(p => p.name === tk || p.name.replace(/\s+/g, '') === clean);
    if (byName) { if (!ids.includes(byName.id)) ids.push(byName.id); return; }
    unmatchedSet.add(tk);
  });
  return ids;
}

function handleImportActs(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const wb = XLSX.read(ev.target.result, { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      const unmatched = new Set();
      const list = rows.map(r => {
        const name = String(r['活動名稱'] || r['名稱'] || '').trim();
        const date = parseExcelDate(r['日期']);
        const typeStr = String(r['活動類型'] || r['類型'] || '').trim();
        let t = T.findIndex(x => x[0] === typeStr);
        if (t < 0) t = 7;
        const ac = matchStaffTokens(r['實際出席人員'] || r['實際出席'] || r['出席人員'] || '', unmatched);
        const pl = matchStaffTokens(r['預計參與人員'] || r['預計參與'] || '', unmatched);
        return {
          year: String(r['學年度'] || S.year).trim(),
          t, name, date,
          time: String(r['時間'] || '').trim(),
          loc: String(r['學校／地點'] || r['地點'] || r['學校'] || '').trim(),
          cls: Number(r['班級數']) || 0,
          ppl: Number(r['人數']) || 0,
          note: String(r['備註'] || '').trim(),
          pl, ac
        };
      }).filter(x => x.name && x.date);

      if (!list.length) return alert('找不到有效活動，請確認欄位包含「日期」與「活動名稱」');
      let msg = `即將匯入 ${list.length} 場招生活動。`;
      if (unmatched.size) msg += `\n\n⚠ 以下 ${unmatched.size} 位人員在名冊中找不到（將略過）：\n` + [...unmatched].join('、');
      if (!confirm(msg + '\n\n確定要繼續匯入嗎？')) return;

      const data = await api('importActivities', { list });
      S.staff = data.staff; S.activities = data.activities;
      draw();
      alert(`匯入完成！共新增 ${list.length} 場活動。`);
    } catch (err) { alert('匯入失敗：' + err.message); }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}

function downloadTemplate() {
  const ws = XLSX.utils.json_to_sheet([
    { '教職員編號': 'T1001', '姓名': '王小明', '處室': '教務處', '狀態': '在職' }
  ]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '教職員名冊');
  XLSX.writeFile(wb, '大明高中_教職員名冊匯入範本.xlsx');
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const wb = XLSX.read(ev.target.result, { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      const list = rows.map(r => ({
        id: r['教職員編號'] || r['編號'] || r['員工編號'] || r['id'] || '',
        name: r['姓名'] || r['name'] || '',
        dept: r['處室'] || r['單位'] || r['部門'] || r['dept'] || '',
        on: String(r['狀態'] ?? '在職') !== '停用'
      })).filter(x => x.id && x.name);
      if (!list.length) return alert('找不到有效資料，請確認欄位包含「教職員編號」與「姓名」');
      if (!confirm(`即將匯入 ${list.length} 筆教職員資料，確定繼續？`)) return;
      const data = await api('importStaff', { list });
      S.staff = data.staff; S.activities = data.activities;
      draw();
      alert('匯入完成！');
    } catch (err) { alert('匯入失敗：' + err.message); }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}

function modal(h) { $('#md').innerHTML = `<div class="mask" onclick="if(event.target===this)closeM()"><div class="modal">${h}</div></div>`; }
function closeM() { $('#md').innerHTML = ''; }
function focusEnd(sel) { const e = $(sel); if (e) { e.focus(); e.setSelectionRange(999, 999); } }

function evt(id) {
  const a = S.activities.find(x => x.id === id);
  const names = ids => ids.map(i => S.staff.find(p => p.id === i)?.name || i).join('、') || '無';
  modal(`
    <span class="tag" style="background:${T[a.t]?.[1] || '#6b7280'}">${T[a.t]?.[0] || '其他'}</span>
    <h3 style="margin:8px 0">${esc(a.name)}${a.cx ? '（已取消）' : ''}</h3>
    <p>📅 ${esc(a.date)} 🕒 ${esc(a.time)}<br>📍 ${esc(a.loc)}（${a.cls || 0}班／${a.ppl || 0}人）<br>📝 ${esc(a.note || '無')}</p>
    <p class="mu">預計參與 ${a.pl.length} 人｜實際出席 ${a.ac.length} 人</p>
    <b>預計參與名單</b><p>${esc(names(a.pl))}</p>
    <b>實際出席名單（計入統計）</b><p>${esc(names(a.ac))}</p>
    <p><button class="btn pri" onclick="closeM()">關閉</button></p>
  `);
}

function person(id) {
  const p = cnt().find(x => x.id === id);
  const l = yrActs().filter(a => !a.cx && a.ac.includes(id)).sort((a, b) => b.date.localeCompare(a.date));
  modal(`
    <h3 style="margin-top:0">${esc(p.name)}（${esc(p.id)}）</h3>
    <p class="mu">${esc(p.dept)}｜${S.year} 學年度實際參與 ${p.total} 次</p>
    <div class="sc">
      <table>
        <tr><th>日期</th><th>活動名稱</th><th>類型</th><th>地點</th></tr>
        ${l.map(a => `<tr><td>${esc(a.date)}</td><td>${esc(a.name)}</td><td><span class="tag" style="background:${T[a.t]?.[1] || '#6b7280'}">${T[a.t]?.[0] || '其他'}</span></td><td>${esc(a.loc)}</td></tr>`).join('') || '<tr><td colspan="4" class="mu">本學年度尚無實際參與紀錄（次數 0）</td></tr>'}
      </table>
    </div>
    <p style="margin-top:14px"><button class="btn pri" onclick="closeM()">關閉</button></p>
  `);
}

function actForm(id = '') {
  const a = S.activities.find(x => x.id === id) || { id: '', year: S.year, t: 0, name: '', date: '', time: '', loc: '', cls: '', ppl: '', note: '', cx: false };
  modal(`
    <h3 style="margin-top:0">${id ? '修改' : '新增'}招生活動</h3>
    <form onsubmit="submitAct(event,'${esc(a.id)}',${!!a.cx})">
      <p>學年度<br><input id="fy" style="width:100px" value="${esc(a.year)}" required></p>
      <p>活動名稱<br><input id="fn" style="width:100%" value="${esc(a.name)}" required></p>
      <p>活動類型<br><select id="ft" style="width:100%">${T.map((t, i) => `<option value="${i}" ${i === a.t ? 'selected' : ''}>${t[0]}</option>`).join('')}</select></p>
      <p>日期 <input id="fd" type="date" value="${esc(a.date)}" required> 時間 <input id="fti" value="${esc(a.time)}" placeholder="09:00–11:30"></p>
      <p>學校／地點<br><input id="fl" style="width:100%" value="${esc(a.loc)}" required></p>
      <p>班級數 <input id="fc" type="number" style="width:90px" value="${esc(a.cls)}"> 人數 <input id="fp" type="number" style="width:90px" value="${esc(a.ppl)}"></p>
      <p>備註<br><input id="fno" style="width:100%" value="${esc(a.note)}"></p>
      <div class="bar"><button class="btn pri">儲存</button><button type="button" class="btn" onclick="closeM()">取消</button></div>
    </form>
  `);
}

async function submitAct(e, id, cx) {
  e.preventDefault();
  try {
    const data = await api('saveActivity', {
      id, year: $('#fy').value.trim(), t: Number($('#ft').value), name: $('#fn').value.trim(),
      date: $('#fd').value, time: $('#fti').value.trim(), loc: $('#fl').value.trim(),
      cls: Number($('#fc').value) || 0, ppl: Number($('#fp').value) || 0, note: $('#fno').value.trim(), cx
    });
    S.staff = data.staff; S.activities = data.activities;
    closeM(); draw();
  } catch (err) { alert('儲存失敗：' + err.message); }
}

async function doCancel(id) {
  if (!confirm('確定要取消此活動？紀錄會保留，但不會計入正式統計。')) return;
  try {
    const data = await api('cancelActivity', { id });
    S.staff = data.staff; S.activities = data.activities;
    draw();
  } catch (err) { alert('取消失敗：' + err.message); }
}

let tempPl = new Set(), tempAc = new Set(), tempActId = '', tempActTitle = '';
function attModal(id) {
  const a = S.activities.find(x => x.id === id);
  tempActId = id; tempActTitle = a.name; tempPl = new Set(a.pl); tempAc = new Set(a.ac);
  renderAttModal('');
}

function renderAttModal(q = '') {
  const list = S.staff.filter(p => (p.on || tempPl.has(p.id) || tempAc.has(p.id)) && (p.name + p.dept + p.id).toLowerCase().includes(q.toLowerCase()));
  modal(`
    <h3 style="margin-top:0">出席名單：${esc(tempActTitle)}</h3>
    <p class="mu">預計與實際分開記錄，僅「實際出席」計入統計。</p>
    <div class="bar">
      <input id="attq" placeholder="快速篩選姓名或處室" value="${esc(q)}" oninput="renderAttModal(this.value);focusEnd('#attq')">
      <button class="btn sm" onclick="tempPl.forEach(x=>tempAc.add(x));renderAttModal($('#attq').value)">將預計名單全勾為實際</button>
    </div>
    <div class="sc" style="max-height:46vh">
      <table>
        <tr><th>姓名</th><th>處室</th><th class="n">預計參與</th><th class="n">實際出席</th></tr>
        ${list.map(p => `<tr>
          <td>${esc(p.name)}${p.on ? '' : ' (停用)'}</td>
          <td>${esc(p.dept)}</td>
          <td class="n"><input type="checkbox" ${tempPl.has(p.id) ? 'checked' : ''} onchange="this.checked?tempPl.add('${esc(p.id)}'):tempPl.delete('${esc(p.id)}')"></td>
          <td class="n"><input type="checkbox" ${tempAc.has(p.id) ? 'checked' : ''} onchange="this.checked?tempAc.add('${esc(p.id)}'):tempAc.delete('${esc(p.id)}')"></td>
        </tr>`).join('')}
      </table>
    </div>
    <div class="bar" style="margin-top:14px">
      <button class="btn pri" onclick="saveAtt()">儲存名單</button>
      <button class="btn" onclick="closeM()">關閉</button>
    </div>
  `);
}

async function saveAtt() {
  try {
    const data = await api('saveAttendance', { actId: tempActId, pl: [...tempPl], ac: [...tempAc] });
    S.staff = data.staff; S.activities = data.activities;
    closeM(); draw();
  } catch (err) { alert('儲存失敗：' + err.message); }
}

function staffForm(id = '') {
  const p = S.staff.find(x => x.id === id) || { id: '', name: '', dept: '', on: true };
  modal(`
    <h3 style="margin-top:0">${id ? '修改' : '新增'}教職員</h3>
    <form onsubmit="submitStaff(event,${!!p.on})">
      <p>教職員編號（唯一識別碼）<br><input id="sid" style="width:100%${id ? ';background:var(--hover)' : ''}" value="${esc(p.id)}" ${id ? 'readonly' : 'required'}></p>
      <p>姓名<br><input id="sn" style="width:100%" value="${esc(p.name)}" required></p>
      <p>處室<br><input id="sd" style="width:100%" value="${esc(p.dept)}" required></p>
      <div class="bar"><button class="btn pri">儲存</button><button type="button" class="btn" onclick="closeM()">取消</button></div>
    </form>
  `);
}

async function submitStaff(e, on) {
  e.preventDefault();
  try {
    const data = await api('saveStaff', { id: $('#sid').value.trim(), name: $('#sn').value.trim(), dept: $('#sd').value.trim(), on });
    S.staff = data.staff; S.activities = data.activities;
    closeM(); draw();
  } catch (err) { alert('儲存失敗：' + err.message); }
}

async function toggleStaff(id) {
  const p = S.staff.find(x => x.id === id);
  if (!confirm(`確定要${p.on ? '停用' : '啟用'}「${p.name}」嗎？`)) return;
  try {
    const data = await api('saveStaff', { ...p, on: !p.on });
    S.staff = data.staff; S.activities = data.activities;
    draw();
  } catch (err) { alert('更新失敗：' + err.message); }
}

window.addEventListener('resize', notifyHeight);
loadAll();
</script>
