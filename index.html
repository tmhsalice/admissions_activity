<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大明高中｜招生活動管理系統</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1f2937;--mu:#6b7280;--bd:#e5e7eb;--pr:#1d4ed8;--prt:#fff;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body.app-on{padding-left:236px}
header{background:#10278f;color:#fff;position:fixed;left:0;top:0;bottom:0;width:236px;padding:22px 16px;display:flex;flex-direction:column;gap:14px;z-index:5;overflow-y:auto}
h1{font-size:19px;margin:0;line-height:1.4}
.brand{display:flex;align-items:center;gap:10px}
h1 small{display:block;font-size:10px;letter-spacing:2px;opacity:.75;font-weight:400}
nav{display:flex;flex-direction:column;gap:4px}
nav button{border:0;background:transparent;color:#e0e7ff;padding:10px 12px;border-radius:8px;cursor:pointer;font:inherit;text-align:left}
nav button:hover{background:rgba(255,255,255,.1)}
nav button.on{background:rgba(255,255,255,.2);color:#fff;font-weight:600}
.ft{margin-top:auto;font-size:12px;color:#c7d2fe;line-height:1.7;border-top:1px solid rgba(255,255,255,.2);padding-top:10px}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
.btn:hover{background:#f3f4f6}
.btn.pri{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.btn.pri:hover{opacity:.92}
.btn.sm{padding:3px 8px;font-size:13px}
.btn.dg{color:#dc2626;border-color:#fecaca}
.btn.dg:hover{background:#fef2f2}
main{max-width:1060px;margin:0 auto;padding:20px}
.sec{font-size:12px;letter-spacing:1px;color:var(--pr);font-weight:600}
h2.pt{margin:2px 0 14px;font-size:24px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,input{font:inherit;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.num{font-size:28px;font-weight:700;color:var(--pr)}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}
.row .l{width:115px;font-size:13px;flex:none}
.trk{flex:1;background:#eef2f7;border-radius:6px;height:14px;overflow:hidden}
.fil{height:14px;border-radius:6px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu);font-weight:600;cursor:pointer;background:#fafafa}
td.n,th.n{text-align:center}
.link{color:var(--pr);cursor:pointer;text-decoration:underline;font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;color:#fff;font-size:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .h{text-align:center;color:var(--mu);font-size:13px;padding:4px 0;font-weight:600}
.cal .d{min-height:78px;border:1px solid var(--bd);border-radius:6px;padding:4px;font-size:12px;background:#fff;overflow:hidden}
.ev{display:block;color:#fff;border-radius:4px;padding:1px 5px;margin-top:2px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.ev.x{opacity:.45;text-decoration:line-through}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.modal{background:var(--card);border-radius:12px;padding:20px;max-width:600px;width:100%;max-height:86vh;overflow:auto}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#10278f 0%,#1e40af 100%)}
.login-box{background:#fff;border-radius:16px;padding:28px;max-width:380px;width:100%;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.login-box h2{margin:0 0 6px;font-size:20px;color:#10278f}
.login-box input{width:100%;margin-top:4px;padding:9px 12px}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.72);display:none;align-items:center;justify-content:center;z-index:50;font-weight:600;color:#10278f;font-size:16px}
.loading.on{display:flex}
@media(max-width:800px){
  body.app-on{padding-left:0}
  header{position:static;width:auto;padding:12px 14px}
  nav{flex-direction:row;flex-wrap:wrap}
  .cal .d{min-height:56px}
  .ev{font-size:0;height:6px;padding:0}
  main{padding:12px}
}
</style>
</head>
<body>
<div id="ld" class="loading">資料同步中，請稍候...</div>
<div id="root"></div>
<div id="md"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbx5qTGHijprOKEd5xbaKzt4LOHKnFtq5PX9HzCbNWmpIza7EyFKkgtB6rvHjY-_cDAi/exec';
const T = [
  ['說明會','#2563eb'],['入班宣導','#16a34a'],['博覽會','#d97706'],['入校參訪','#9333ea'],
  ['活動設攤','#e11d48'],['營隊體驗課程','#0891b2'],['介紹就讀','#65a30d'],['其他','#6b7280']
];

const S = {
  auth: JSON.parse(sessionStorage.getItem('dm_auth') || 'null'),
  userName: sessionStorage.getItem('dm_name') || '',
  staff: [],
  activities: [],
  page: 'home',
  year: '115',
  m: new Date().getMonth(),
  calY: new Date().getFullYear(),
  view: 'cal',
  q: '',
  aq: '',
  rq: '',
  sort: 'total',
  dir: -1
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const setLoad = on => $('#ld').classList.toggle('on', on);

async function api(action, payload = {}) {
  setLoad(true);
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ auth: S.auth, action, payload })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '操作失敗');
    return json.data;
  } finally {
    setLoad(false);
  }
}

function renderLogin(err = '') {
  document.body.classList.remove('app-on');
  $('#root').innerHTML = `
  <div class="login-wrap">
    <div class="login-box">
      <div class="sec">TA-MING HIGH SCHOOL</div>
      <h2>大明高中招生活動管理系統</h2>
      <p class="mu" style="margin-top:0">管理者專用登入介面</p>
      ${err ? `<p style="color:#dc2626;font-size:13px;background:#fef2f2;padding:8px;border-radius:6px">${esc(err)}</p>` : ''}
      <form onsubmit="doLogin(event)">
        <p><label class="mu">管理者帳號</label><input id="lu" required autocomplete="username" placeholder="預設 admin"></p>
        <p><label class="mu">密碼</label><input id="lp" type="password" required autocomplete="current-password" placeholder="請輸入密碼"></p>
        <p style="margin-top:18px"><button class="btn pri" style="width:100%;padding:10px">登入系統</button></p>
      </form>
    </div>
  </div>`;
}

async function doLogin(e) {
  e.preventDefault();
  S.auth = { user: $('#lu').value.trim(), pass: $('#lp').value.trim() };
  try {
    const info = await api('login');
    S.userName = info.name;
    sessionStorage.setItem('dm_auth', JSON.stringify(S.auth));
    sessionStorage.setItem('dm_name', S.userName);
    await loadAll();
  } catch (err) {
    S.auth = null;
    renderLogin(err.message);
  }
}

function logout() {
  sessionStorage.removeItem('dm_auth');
  sessionStorage.removeItem('dm_name');
  S.auth = null;
  renderLogin();
}

async function loadAll() {
  try {
    const data = await api('getAll');
    S.staff = data.staff || [];
    S.activities = data.activities || [];
    draw();
  } catch (err) {
    alert('讀取資料失敗：' + err.message);
  }
}

const yrActs = () => S.activities.filter(a => String(a.year) === String(S.year));
const fa = a => (a.name + a.loc + (T[a.t]?.[0] || '')).toLowerCase().includes(S.aq.toLowerCase());
const cnt = () => S.staff.map(p => {
  const c = T.map(() => 0);
  yrActs().forEach(a => { if (!a.cx && a.ac.includes(p.id) && T[a.t]) c[a.t]++; });
  return { ...p, c, total: c.reduce((x, y) => x + y, 0) };
});

function getYears() {
  const set = new Set(['115', '116', '117', ...S.activities.map(a => String(a.year))]);
  return [...set].sort();
}

function draw() {
  document.body.classList.add('app-on');
  const pages = [
    ['home', '首頁總覽'],
    ['cal', '招生行事曆'],
    ['stats', '參與統計'],
    ['manage', '活動管理'],
    ['roster', '教職員名冊']
  ];
  $('#root').innerHTML = `
  <header>
    <div class="brand">
      <h1>大明高中<small>TA-MING HIGH SCHOOL</small>招生活動管理系統</h1>
    </div>
    <nav>${pages.map(([k, v]) => `<button class="${S.page === k ? 'on' : ''}" onclick="S.page='${k}';draw()">${v}</button>`).join('')}</nav>
    <div class="ft">
      登入者：<b>${esc(S.userName)}</b><br>
      <button class="btn sm" style="margin-top:6px;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)" onclick="loadAll()">重新整理</button>
      <button class="btn sm" style="margin-top:6px;background:transparent;color:#fecaca;border-color:rgba(254,202,202,.4)" onclick="logout()">登出</button>
      <div style="margin-top:10px;opacity:.8">內部使用，請勿外流。<br>維護請洽 #251 思婷</div>
    </div>
  </header>
  <main>
    <div class="sec">TA-MING ADMISSIONS</div>
    <h2 class="pt">${pages.find(x => x[0] === S.page)[1]}</h2>
    <div class="bar">
      <b>學年度</b>
      <select onchange="S.year=this.value;draw()">
        ${getYears().map(y => `<option value="${y}" ${String(S.year) === y ? 'selected' : ''}>${y} 學年度</option>`).join('')}
      </select>
    </div>
    <div id="content"></div>
  </main>`;
  $('#content').innerHTML = ({ home, cal, stats, manage, roster }[S.page])();
}

function home() {
  const as = yrActs().filter(a => !a.cx);
  const c = cnt();
  const tt = T.map((_, i) => as.filter(a => a.t === i).length);
  const mx = Math.max(1, ...tt);
  const people = as.reduce((s, a) => s + a.ac.length, 0);
  const actStaff = c.filter(x => x.total > 0).length;
  const top = [...c].filter(x => x.total > 0).sort((a, b) => b.total - a.total).slice(0, 10);

  return `
  <div class="grid">
    <div class="card"><div class="mu">活動總場次（不含取消）</div><div class="num">${as.length}</div></div>
    <div class="card"><div class="mu">實際參與總人次</div><div class="num">${people}</div></div>
    <div class="card"><div class="mu">參與教職員人數</div><div class="num">${actStaff} <span class="mu">/ ${S.staff.filter(p => p.on).length} 在職</span></div></div>
  </div>
  <div class="card">
    <b>各類型場次分布</b>
    ${T.map((t, i) => `<div class="row"><span class="l"><span class="dot" style="background:${t[1]}"></span>${t[0]}</span><div class="trk"><div class="fil" style="width:${tt[i] / mx * 100}%;background:${t[1]}"></div></div><span style="width:28px;text-align:right">${tt[i]}</span></div>`).join('')}
  </div>
  <div class="card">
    <b>參與次數排行榜（前 10 名）</b>
    ${top.map((p, i) => `<div class="row"><span class="l">${i + 1}. <span class="link" onclick="person('${esc(p.id)}')">${esc(p.name)}</span></span><div class="trk"><div class="fil" style="width:${p.total / Math.max(1, top[0].total) * 100}%;background:var(--pr)"></div></div><span style="width:28px;text-align:right">${p.total}</span></div>`).join('') || '<p class="mu">本學年度尚無實際出席紀錄</p>'}
  </div>`;
}

function cal() {
  const y = S.calY, m = S.m;
  const f = new Date(y, m, 1).getDay(), n = new Date(y, m + 1, 0).getDate();
  const ds = d => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  let h = `
  <div class="bar">
    <button class="btn" onclick="shiftMonth(-1)">◀</button>
    <b>${y} 年 ${m + 1} 月</b>
    <button class="btn" onclick="shiftMonth(1)">▶</button>
    <button class="btn ${S.view === 'cal' ? 'pri' : ''}" onclick="S.view='cal';draw()">月曆</button>
    <button class="btn ${S.view === 'list' ? 'pri' : ''}" onclick="S.view='list';draw()">列表</button>
    <input id="aq" placeholder="搜尋活動名稱、類型或地點" value="${esc(S.aq)}" oninput="S.aq=this.value;draw();focusEnd('#aq')">
  </div>
  <div class="card" style="padding:10px 14px">
    ${T.map(t => `<span style="margin-right:10px;font-size:12px;display:inline-block"><span class="dot" style="background:${t[1]}"></span>${t[0]}</span>`).join('')}
  </div>`;

  if (S.view === 'cal') {
    h += '<div class="card cal">' + '日一二三四五六'.split('').map(x => `<div class="h">${x}</div>`).join('') + '<div></div>'.repeat(f);
    for (let d = 1; d <= n; d++) {
      const list = yrActs().filter(a => a.date === ds(d) && fa(a));
      h += `<div class="d"><b>${d}</b>${list.map(a => `<span class="ev ${a.cx ? 'x' : ''}" style="background:${T[a.t]?.[1] || '#6b7280'}" onclick="evt('${esc(a.id)}')">${esc(a.name)}</span>`).join('')}</div>`;
    }
    h += '</div>';
  } else {
    const ym = `${y}-${String(m + 1).padStart(2, '0')}`;
    const list = yrActs().filter(a => a.date.startsWith(ym) && fa(a)).sort((a, b) => a.date.localeCompare(b.date));
    h += `<div class="card">${list.map(a => `<div class="row" style="cursor:pointer" onclick="evt('${esc(a.id)}')"><span class="tag" style="background:${T[a.t]?.[1] || '#6b7280'}">${T[a.t]?.[0] || '其他'}</span><span>${esc(a.date)} ${esc(a.time)}　<b>${esc(a.name)}</b>（${esc(a.loc)}）${a.cx ? '【已取消】' : ''}</span></div>`).join('') || '<p class="mu">本月無活動</p>'}</div>`;
  }
  return h;
}

function shiftMonth(delta) {
  const d = new Date(S.calY, S.m + delta, 1);
  S.calY = d.getFullYear(); S.m = d.getMonth();
  draw();
}

function stats() {
  const q = S.q.toLowerCase();
  let c = cnt().filter(p =>
    p.name.toLowerCase().includes(q) ||
    p.id.toLowerCase().includes(q) ||
    p.dept.toLowerCase().includes(q) ||
    yrActs().some(a => !a.cx && a.ac.includes(p.id) && (a.name + a.loc + (T[a.t]?.[0] || '')).toLowerCase().includes(q))
  );
  c.sort((a, b) => S.sort === 'name' ? S.dir * a.name.localeCompare(b.name) :
    S.sort === 'dept' ? S.dir * a.dept.localeCompare(b.dept) :
    S.dir * ((S.sort === 'total' ? a.total - b.total : a.c[S.sort] - b.c[S.sort])));

  const th = (k, t, cl = '') => `<th class="${cl}" onclick="S.dir=S.sort==='${k}'?-S.dir:-1;S.sort='${k}';draw()">${t}${S.sort === k ? (S.dir < 0 ? ' ▼' : ' ▲') : ''}</th>`;
  return `
  <div class="bar">
    <input id="sq" placeholder="搜尋姓名、編號、處室或活動" style="min-width:240px" value="${esc(S.q)}" oninput="S.q=this.value;draw();focusEnd('#sq')">
    <button class="btn pri" onclick="exportStatsExcel()">匯出統計 Excel</button>
    <span class="mu">點欄位標題可排序；點姓名看個人明細</span>
  </div>
  <div class="card sc">
    <table>
      <tr>${th('name', '姓名')}${th('dept', '處室')}${T.map((t, i) => th(i, t[0], 'n')).join('')}${th('total', '總次數', 'n')}</tr>
      ${c.map(p => `<tr>
        <td><span class="link" onclick="person('${esc(p.id)}')">${esc(p.name)}</span>${p.on ? '' : ' <span class="mu">(停用)</span>'}</td>
        <td>${esc(p.dept)}</td>
        ${p.c.map(x => `<td class="n">${x}</td>`).join('')}
        <td class="n"><b>${p.total}</b></td>
      </tr>`).join('') || '<tr><td colspan="11" class="mu">尚無教職員資料，請先至「教職員名冊」匯入</td></tr>'}
    </table>
  </div>`;
}

function exportStatsExcel() {
  const rows = cnt().map(p => {
    const obj = { '教職員編號': p.id, '姓名': p.name, '處室': p.dept, '狀態': p.on ? '在職' : '停用' };
    T.forEach((t, i) => obj[t[0]] = p.c[i]);
    obj['總次數'] = p.total;
    return obj;
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, `${S.year}學年度統計`);
  XLSX.writeFile(wb, `大明高中_${S.year}學年度_教職員招生參與統計.xlsx`);
}

function manage() {
  const list = yrActs().filter(fa).sort((a, b) => b.date.localeCompare(a.date));
  const today = new Date().toISOString().slice(0, 10);
  return `
  <div class="bar">
    <button class="btn pri" onclick="actForm()">＋ 新增活動</button>
    <input id="aq" placeholder="搜尋活動名稱、類型或地點" value="${esc(S.aq)}" oninput="S.aq=this.value;draw();focusEnd('#aq')">
  </div>
  <div class="card sc">
    <table>
      <tr><th>日期</th><th>活動名稱</th><th>學校／地點</th><th class="n">班/人</th><th class="n">預計</th><th class="n">實際</th><th>狀態</th><th>操作</th></tr>
      ${list.map(a => `<tr>
        <td>${esc(a.date)}</td>
        <td><span class="dot" style="background:${T[a.t]?.[1] || '#6b7280'}"></span>${esc(a.name)}</td>
        <td>${esc(a.loc)}</td>
        <td class="n">${a.cls || 0}班/${a.ppl || 0}人</td>
        <td class="n">${a.pl.length}</td>
        <td class="n"><b>${a.ac.length}</b></td>
        <td>${a.cx ? '<span style="color:#dc2626">已取消</span>' : a.date < today ? '已結束' : '預定'}</td>
        <td>
          <button class="btn sm pri" onclick="attModal('${esc(a.id)}')">出席名單</button>
          <button class="btn sm" onclick="actForm('${esc(a.id)}')">修改</button>
          ${a.cx ? '' : `<button class="btn sm dg" onclick="doCancel('${esc(a.id)}')">取消</button>`}
        </td>
      </tr>`).join('') || '<tr><td colspan="8" class="mu">本學年度尚無活動，請點選「＋ 新增活動」</td></tr>'}
    </table>
  </div>`;
}

function roster() {
  const q = S.rq.toLowerCase();
  const list = S.staff.filter(p => (p.id + p.name + p.dept).toLowerCase().includes(q));
  return `
  <div class="bar">
    <label class="btn pri" style="display:inline-block">
      匯入 Excel 名冊 <input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleImport(event)">
    </label>
    <button class="btn" onclick="downloadTemplate()">下載匯入範本</button>
    <button class="btn" onclick="staffForm()">＋ 新增教職員</button>
    <input id="rq" placeholder="搜尋編號、姓名或處室" value="${esc(S.rq)}" oninput="S.rq=this.value;draw();focusEnd('#rq')">
  </div>
  <div class="card sc">
    <table>
      <tr><th>教職員編號</th><th>姓名</th><th>處室</th><th>狀態</th><th>操作</th></tr>
      ${list.map(p => `<tr>
        <td>${esc(p.id)}</td>
        <td>${esc(p.name)}</td>
        <td>${esc(p.dept)}</td>
        <td>${p.on ? '<span style="color:#16a34a">在職</span>' : '<span class="mu">已停用</span>'}</td>
        <td>
          <button class="btn sm" onclick="staffForm('${esc(p.id)}')">修改</button>
          <button class="btn sm ${p.on ? 'dg' : ''}" onclick="toggleStaff('${esc(p.id)}')">${p.on ? '停用' : '啟用'}</button>
        </td>
      </tr>`).join('') || '<tr><td colspan="5" class="mu">尚無教職員名冊</td></tr>'}
    </table>
  </div>
  <p class="mu">以「教職員編號」識別人員，重複匯入會自動更新處室與姓名；停用後仍完整保留過去的參與紀錄。</p>`;
}

function downloadTemplate() {
  const ws = XLSX.utils.json_to_sheet([
    { '教職員編號': 'T1001', '姓名': '王小明', '處室': '教務處', '狀態': '在職' },
    { '教職員編號': 'T1002', '姓名': '林美華', '處室': '輔導室', '狀態': '在職' }
  ]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '教職員名冊');
  XLSX.writeFile(wb, '大明高中_教職員名冊匯入範本.xlsx');
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const wb = XLSX.read(ev.target.result, { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      const list = rows.map(r => ({
        id: r['教職員編號'] || r['編號'] || r['員工編號'] || r['id'] || '',
        name: r['姓名'] || r['name'] || '',
        dept: r['處室'] || r['單位'] || r['部門'] || r['dept'] || '',
        on: String(r['狀態'] ?? '在職') !== '停用'
      })).filter(x => x.id && x.name);
      if (!list.length) return alert('找不到有效資料，請確認欄位包含「教職員編號」與「姓名」');
      if (!confirm(`即將匯入 ${list.length} 筆教職員資料（相同編號將自動更新），確定繼續？`)) return;
      const data = await api('importStaff', { list });
      S.staff = data.staff; S.activities = data.activities;
      draw();
      alert('匯入完成！');
    } catch (err) {
      alert('匯入失敗：' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}

function modal(h) { $('#md').innerHTML = `<div class="mask" onclick="if(event.target===this)closeM()"><div class="modal">${h}</div></div>`; }
function closeM() { $('#md').innerHTML = ''; }
function focusEnd(sel) { const e = $(sel); if (e) { e.focus(); e.setSelectionRange(999, 999); } }

function evt(id) {
  const a = S.activities.find(x => x.id === id);
  const names = ids => ids.map(i => S.staff.find(p => p.id === i)?.name || i).join('、') || '無';
  modal(`
    <span class="tag" style="background:${T[a.t]?.[1] || '#6b7280'}">${T[a.t]?.[0] || '其他'}</span>
    <h3 style="margin:8px 0">${esc(a.name)}${a.cx ? '（已取消）' : ''}</h3>
    <p>📅 ${esc(a.date)}　🕒 ${esc(a.time)}<br>📍 ${esc(a.loc)}（${a.cls || 0}班／${a.ppl || 0}人）<br>📝 ${esc(a.note || '無')}</p>
    <p class="mu">預計參與 ${a.pl.length} 人｜實際出席 ${a.ac.length} 人</p>
    <b>預計參與名單</b><p>${esc(names(a.pl))}</p>
    <b>實際出席名單（計入統計）</b><p>${esc(names(a.ac))}</p>
    <p><button class="btn" onclick="closeM()">關閉</button></p>
  `);
}

function person(id) {
  const p = cnt().find(x => x.id === id);
  const l = yrActs().filter(a => !a.cx && a.ac.includes(id)).sort((a, b) => b.date.localeCompare(a.date));
  modal(`
    <h3 style="margin-top:0">${esc(p.name)}（${esc(p.id)}）</h3>
    <p class="mu">${esc(p.dept)}｜${S.year} 學年度實際參與 ${p.total} 次</p>
    <div class="sc">
      <table>
        <tr><th>日期</th><th>活動名稱</th><th>類型</th><th>地點</th></tr>
        ${l.map(a => `<tr><td>${esc(a.date)}</td><td>${esc(a.name)}</td><td><span class="tag" style="background:${T[a.t]?.[1] || '#6b7280'}">${T[a.t]?.[0] || '其他'}</span></td><td>${esc(a.loc)}</td></tr>`).join('') || '<tr><td colspan="4" class="mu">本學年度尚無實際參與紀錄（次數 0）</td></tr>'}
      </table>
    </div>
    <p><button class="btn" onclick="closeM()">關閉</button></p>
  `);
}

function actForm(id = '') {
  const a = S.activities.find(x => x.id === id) || { id: '', year: S.year, t: 0, name: '', date: '', time: '', loc: '', cls: '', ppl: '', note: '', cx: false };
  modal(`
    <h3 style="margin-top:0">${id ? '修改' : '新增'}招生活動</h3>
    <form onsubmit="submitAct(event,'${esc(a.id)}',${!!a.cx})">
      <p>學年度<br><input id="fy" style="width:100px" value="${esc(a.year)}" required></p>
      <p>活動名稱<br><input id="fn" style="width:100%" value="${esc(a.name)}" required></p>
      <p>活動類型<br><select id="ft" style="width:100%">${T.map((t, i) => `<option value="${i}" ${i === a.t ? 'selected' : ''}>${t[0]}</option>`).join('')}</select></p>
      <p>日期 <input id="fd" type="date" value="${esc(a.date)}" required>　時間 <input id="fti" value="${esc(a.time)}" placeholder="09:00–11:30"></p>
      <p>學校／地點<br><input id="fl" style="width:100%" value="${esc(a.loc)}" required></p>
      <p>班級數 <input id="fc" type="number" style="width:90px" value="${esc(a.cls)}">　人數 <input id="fp" type="number" style="width:90px" value="${esc(a.ppl)}"></p>
      <p>備註<br><input id="fno" style="width:100%" value="${esc(a.note)}"></p>
      <div class="bar"><button class="btn pri">儲存</button><button type="button" class="btn" onclick="closeM()">取消</button></div>
    </form>
  `);
}

async function submitAct(e, id, cx) {
  e.preventDefault();
  try {
    const data = await api('saveActivity', {
      id, year: $('#fy').value.trim(), t: Number($('#ft').value), name: $('#fn').value.trim(),
      date: $('#fd').value, time: $('#fti').value.trim(), loc: $('#fl').value.trim(),
      cls: Number($('#fc').value) || 0, ppl: Number($('#fp').value) || 0, note: $('#fno').value.trim(), cx
    });
    S.staff = data.staff; S.activities = data.activities;
    closeM(); draw();
  } catch (err) { alert('儲存失敗：' + err.message); }
}

async function doCancel(id) {
  if (!confirm('確定要取消此活動？紀錄會保留，但不會計入正式統計。')) return;
  try {
    const data = await api('cancelActivity', { id });
    S.staff = data.staff; S.activities = data.activities;
    draw();
  } catch (err) { alert('取消失敗：' + err.message); }
}

let tempPl = new Set(), tempAc = new Set(), tempActId = '', tempActTitle = '';
function attModal(id) {
  const a = S.activities.find(x => x.id === id);
  tempActId = id; tempActTitle = a.name; tempPl = new Set(a.pl); tempAc = new Set(a.ac);
  renderAttModal('');
}

function renderAttModal(q = '') {
  const list = S.staff.filter(p => (p.on || tempPl.has(p.id) || tempAc.has(p.id)) && (p.name + p.dept + p.id).toLowerCase().includes(q.toLowerCase()));
  modal(`
    <h3 style="margin-top:0">出席名單：${esc(tempActTitle)}</h3>
    <p class="mu">預計與實際分開記錄，僅「實際出席」計入統計。</p>
    <div class="bar">
      <input id="attq" placeholder="快速篩選姓名或處室" value="${esc(q)}" oninput="renderAttModal(this.value);focusEnd('#attq')">
      <button class="btn sm" onclick="tempPl.forEach(x=>tempAc.add(x));renderAttModal($('#attq').value)">將預計名單全勾為實際</button>
    </div>
    <div class="sc" style="max-height:46vh">
      <table>
        <tr><th>姓名</th><th>處室</th><th class="n">預計參與</th><th class="n">實際出席</th></tr>
        ${list.map(p => `<tr>
          <td>${esc(p.name)}${p.on ? '' : ' (停用)'}</td>
          <td>${esc(p.dept)}</td>
          <td class="n"><input type="checkbox" ${tempPl.has(p.id) ? 'checked' : ''} onchange="this.checked?tempPl.add('${esc(p.id)}'):tempPl.delete('${esc(p.id)}')"></td>
          <td class="n"><input type="checkbox" ${tempAc.has(p.id) ? 'checked' : ''} onchange="this.checked?tempAc.add('${esc(p.id)}'):tempAc.delete('${esc(p.id)}')"></td>
        </tr>`).join('')}
      </table>
    </div>
    <div class="bar" style="margin-top:14px">
      <button class="btn pri" onclick="saveAtt()">儲存名單</button>
      <button class="btn" onclick="closeM()">關閉</button>
    </div>
  `);
}

async function saveAtt() {
  try {
    const data = await api('saveAttendance', { actId: tempActId, pl: [...tempPl], ac: [...tempAc] });
    S.staff = data.staff; S.activities = data.activities;
    closeM(); draw();
  } catch (err) { alert('儲存失敗：' + err.message); }
}

function staffForm(id = '') {
  const p = S.staff.find(x => x.id === id) || { id: '', name: '', dept: '', on: true };
  modal(`
    <h3 style="margin-top:0">${id ? '修改' : '新增'}教職員</h3>
    <form onsubmit="submitStaff(event,${!!p.on})">
      <p>教職員編號（唯一識別碼）<br><input id="sid" style="width:100%${id ? ';background:#f3f4f6' : ''}" value="${esc(p.id)}" ${id ? 'readonly' : 'required'}></p>
      <p>姓名<br><input id="sn" style="width:100%" value="${esc(p.name)}" required></p>
      <p>處室<br><input id="sd" style="width:100%" value="${esc(p.dept)}" required></p>
      <div class="bar"><button class="btn pri">儲存</button><button type="button" class="btn" onclick="closeM()">取消</button></div>
    </form>
  `);
}

async function submitStaff(e, on) {
  e.preventDefault();
  try {
    const data = await api('saveStaff', { id: $('#sid').value.trim(), name: $('#sn').value.trim(), dept: $('#sd').value.trim(), on });
    S.staff = data.staff; S.activities = data.activities;
    closeM(); draw();
  } catch (err) { alert('儲存失敗：' + err.message); }
}

async function toggleStaff(id) {
  const p = S.staff.find(x => x.id === id);
  if (!confirm(`確定要${p.on ? '停用' : '啟用'}「${p.name}」嗎？`)) return;
  try {
    const data = await api('saveStaff', { ...p, on: !p.on });
    S.staff = data.staff; S.activities = data.activities;
    draw();
  } catch (err) { alert('更新失敗：' + err.message); }
}

if (S.auth) loadAll(); else renderLogin();
</script>
