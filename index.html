<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大明高級中學｜招生活動管理系統</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#02257F;--navylight:#1B3A93;--gold:#D4A017;--goldlight:#E8C158;
  --bg:#F8F6F1;--card:#FFFFFF;--tx:#222831;--mu:#6B7280;--bd:#E3DFD3;--pr:#02257F;--prt:#FFFFFF;
  box-sizing:border-box
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,"Microsoft JhengHei","PingFang TC",sans-serif;-webkit-font-smoothing:antialiased}
body.app-on{padding-left:256px}

header{background:var(--navy);color:#fff;position:fixed;left:0;top:0;bottom:0;width:256px;display:flex;flex-direction:column;z-index:20;overflow-y:auto}
.brand-box{padding:24px;border-bottom:1px solid var(--navylight)}
.brand-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brand-top img{width:44px;height:44px;object-fit:contain;flex:none}
.brand-note{font-size:10px;letter-spacing:.1em;color:rgba(212,160,23,.9);margin:0}
h1{font-size:20px;font-weight:500;margin:0;line-height:1.35;color:#fff}
.en-title{display:inline-block;font-size:11px;letter-spacing:.2em;color:var(--gold);margin:6px 0 0;padding-bottom:8px;border-bottom:1px solid rgba(212,160,23,.4)}
.sys-sub{font-size:12px;color:rgba(255,255,255,.7);margin:8px 0 0}

nav{display:flex;flex-direction:column;padding:8px 0}
nav button{border:0;border-left:4px solid transparent;background:transparent;color:rgba(255,255,255,.8);padding:12px 24px;cursor:pointer;font:inherit;font-size:16px;text-align:left;transition:background .15s,color .15s}
nav button:hover{background:var(--navylight);color:#fff}
nav button.on{background:rgba(255,255,255,.08);border-left-color:var(--gold);color:#fff;font-weight:600}

.ft{margin-top:auto;padding:16px 24px;border-top:1px solid var(--navylight);font-size:12px;color:rgba(255,255,255,.75);line-height:1.7}
.ft-btn{display:inline-block;padding:4px 10px;font-size:12px;border-radius:4px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;text-decoration:none;margin-right:6px;margin-top:6px;transition:background .15s}
.ft-btn:hover{background:var(--navylight)}
.ft-copy{margin-top:12px;font-size:11px;color:rgba(255,255,255,.45);line-height:1.6}

main{max-width:1080px;margin:0 auto;padding:32px 36px}
.sec{
