<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大明高級中學｜招生活動管理系統</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#02257F;--navylight:#1B3A93;--gold:#D4A017;--goldlight:#E8C158;
  --bg:#F8F6F1;--card:#FFFFFF;--tx:#222831;--mu:#6B7280;--bd:#E3DFD3;--pr:#02257F;--prt:#FFFFFF;
  box-sizing:border-box
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Microsoft JhengHei","PingFang TC",sans-serif;-webkit-font-smoothing:antialiased}
body.app-on{padding-left:256px}

header{background:var(--navy);color:#fff;position:fixed;left:0;top:0;bottom:0;width:256px;display:flex;flex-direction:column;z-index:20;overflow-y:auto}
.brand-box{padding:24px;border-bottom:1px solid var(--navylight)}
.brand-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brand-top img{width:44px;height:44px;object-fit:contain;flex:none}
.brand-note{font-size:10px;letter-spacing:.1em;color:rgba(212,160,23,.9);margin:0}
h1{font-size:20px;font-weight:500;margin:0;line-height:1.35;color:#fff}
.en-title{display:inline-block;font-size:11px;letter-spacing:.2em;color:var(--gold);margin:6px 0 0;padding-bottom:8px;border-bottom:1px solid rgba(212,160,23,.4)}
.sys-sub{font-size:12px;color:rgba(255,255,255,.7);margin:8px 0 0}

nav{display:flex;flex-direction:column;padding:8px 0}
nav button{border:0;border-left:4px solid transparent;background:transparent;color:rgba(255,255,255,.8);padding:12px 24px;cursor:pointer;font:inherit;font-size:16px;text-align:left;transition:background .15s,color .15s}
nav button:hover{background:var(--navylight);color:#fff}
nav button.on{background:rgba(255,255,255,.08);border-left-color:var(--gold);color:#fff;font-weight:600}

.ft{margin-top:auto;padding:16px 24px;border-top:1px solid var(--navylight);font-size:12px;color:rgba(255,255,255,.75);line-height:1.7}
.ft-btn{display:inline-block;padding:4px 10px;font-size:12px;border-radius:4px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;text-decoration:none;margin-right:6px;margin-top:6px;transition:background .15s}
.ft-btn:hover{background:var(--navylight)}
.ft-copy{margin-top:12px;font-size:11px;color:rgba(255,255,255,.45);line-height:1.6}

main{max-width:1380px;margin:0 auto;padding:28px 36px}
.sec{font-size:12px;letter-spacing:.15em;color:var(--gold);font-weight:600;text-transform:uppercase;margin-bottom:4px}
h2.pt{margin:0 0 18px;font-size:28px;font-weight:600;color:var(--tx)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select,input{font:inherit;padding:7px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
select:focus,input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,160,23,.2)}

.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:6px;cursor:pointer;font:inherit;font-size:15px;text-decoration:none;display:inline-block;transition:background .15s,opacity .15s}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:var(--navylight)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.dg{color:#9E2A2F;border-color:#e5c3c5}
.btn.dg:hover{background:#fdf2f2}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:18px 20px;margin-bottom:14px}
.num{font-size:30px;font-weight:700;color:var(--navy);margin-top:4px}
.mu{color:var(--mu);font-size:14px}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row .l{width:130px;font-size:15px;flex:none}
.trk{flex:1;background:var(--bg);border-radius:4px;height:16px;overflow:hidden;border:1px solid var(--bd)}
.fil{height:16px;border-radius:3px}

.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:11px 12px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu);font-weight:600;cursor:pointer;background:var(--bg);border-bottom:2px solid rgba(212,160,23,.45)}
td.n,th.n{text-align:center}
.link{color:var(--navy);cursor:pointer;text-decoration:underline;font-weight:500}
.link:hover{color:var(--gold)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:middle}
.tag{display:inline-block;padding:2px 9px;border-radius:4px;color:#fff;font-size:13px;font-weight:500}

/* 行事曆放大與清晰度優化 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{text-align:center;color:var(--tx);font-size:15px;padding:10px 0;font-weight:600;background:var(--bg);border-radius:4px}
.cal .d{min-height:112px;border:1px solid var(--bd);border-radius:6px;padding:8px;font-size:15px;background:#fff;overflow:hidden}
.cal .d b{display:inline-block;margin-bottom:4px;color:var(--tx)}
.ev{display:block;color:#fff;border-radius:5px;padding:4px 8px;margin-top:5px;cursor:pointer;font-size:14px;font-weight:500;line-height:1.35;white-space:normal;word-break:break-word;transition:opacity .15s}
.ev:hover{opacity:.88}
.ev.x{opacity:.45;text-decoration:line-through}

.mask{position:fixed;inset:0;background:rgba(2,37,127,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:24px;max-width:640px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 12px 32px rgba(0,0,0,.2)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--navy)}
.login-box{background:#fff;border-radius:8px;padding:28px;max-width:380px;width:100%;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.login-box h2{margin:0 0 6px;font-size:20px;color:var(--navy)}
.loading{position:fixed;inset:0;background:rgba(248,246,241,.78);display:none;align-items:center;justify-content:center;z-index:50;font-weight:600;color:var(--navy);font-size:16px}
.loading.on{display:flex}

@media(max-width:800px){
  body.app-on{padding-left:0}
  header{position:static;width:auto}
  .brand-box{padding:16px}
  nav{flex-direction:row;overflow-x:auto;padding:0}
  nav button{padding:10px 14px;font-size:14px;white-space:nowrap;border-left:0;border-bottom:3px solid transparent}
  nav button.on{border-left:0;border-bottom-color:var(--gold)}
  .ft{padding:12px 16px}
  .cal .d{min-height:64px;padding:4px;font-size:13px}
  .ev{font-size:11px;padding:2px 4px}
  main{padding:16px}
}
</style>
</head>
<body>
<div id="ld" class="loading">資料同步中，請稍候...</div>
<div id="root"></div>
<div id="md"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbx5qTGHijprOKEd5xbaKzt4LOHKnFtq5PX9HzCbNWmpIza7EyFKkgtB6rvHjY-_cDAi/exec';
const GUIDE_URL = 'https://tmhsalice.github.io/admissions_guide/';
const LOGO_URL = 'https://tmhsalice.github.io/admissions_guide/logo.png';
const T = [
  ['說明會','#02257F'],['入班宣導','#2F8F45'],['博覽會','#D4A017'],['入校參訪','#7C3AED'],
  ['活動設攤','#9E2A2F'],['營隊體驗課程','#258DC4'],['介紹就讀','#65A30D'],['其他','#6B7280']
];

const S = {
  staffId: localStorage.getItem('dm_staffId') || '',
  userName: localStorage.getItem('dm_staffName') || '',
  staff: [],
  activities: [],
  page: 'home',
  year: '115',
  m: new Date().getMonth(),
  calY: new Date().getFullYear(),
  view: 'cal',
  q: '',
  aq: '',
  rq: '',
  sort: 'total',
  dir: -1
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const setLoad = on => $('#ld').classList.toggle('on', on);

async function api(action, payload = {}) {
  setLoad(true);
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ auth: { staffId: S.staffId }, action, payload })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '操作失敗');
    return json.data;
  } finally {
    setLoad(false);
  }
}

function renderBlocked(msg = '請先從「招生工作手冊」輸入員工編號登入後，再由左側選單進入本系統。') {
  document.body.classList.remove('app-on');
  $('#root').innerHTML = `
  <div class="login-wrap">
    <div class="login-box">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px">
        <img src="${LOGO_URL}" alt="" style="width:40px;height:40px;object-fit:contain" onerror="this.style.display='none'">
        <div>
          <div style="font-size:16px;font-weight:600;color:var(--navy)">大明高級中學</div>
          <div style="font-size:10px;letter-spacing:.15em;color:var(--gold)">TA-MING HIGH SCHOOL</div>
        </div>
      </div>
      <h2>招生活動管理系統</h2>
      <p style="color:#9E2A2F;font-size:14px;background:#fdf2f2;border:1px solid #f5c6cb;padding:10px 12px;border-radius:6px;margin:14px 0">${esc(msg)}</p>
      <a href="${GUIDE_URL}" class="btn pri" style="width:100%;text-align:center;padding:10px">前往招生工作手冊登入</a>
    </div>
  </div>`;
}

async function loadAll() {
  if (!S.staffId) return renderBlocked();
  try {
    const data = await api('getAll');
    S.staff = data.staff || [];
    S.activities = data.activities || [];
    draw();
  } catch (err) {
    renderBlocked('驗證未通過：' + err.message);
  }
}

const yrActs = () => S.activities.filter(a => String(a.year) === String(S.year));
const fa = a => (a.name + a.loc + (T[a.t]?.[0] || '')).toLowerCase().includes(S.aq.toLowerCase());
const cnt = () => S.staff.map(p => {
  const c = T.map(() => 0);
  yrActs().forEach(a => { if (!a.cx && a.ac.includes(p.id) && T[a.t]) c[a.t]++; });
  return { ...p, c, total: c.reduce((x, y) => x + y, 0) };
});

function getYears() {
  const set = new Set(['115', '116', '117', ...S.activities.map(a => String(a.year))]);
  return [...set].sort();
}

function draw() {
  document.body.classList.add('app-on');
  const pages = [
    ['home', '首頁總覽'],
    ['cal', '招生行事曆'],
    ['stats', '參與統計'],
    ['manage', '活動管理'],
    ['roster', '教職員名冊']
  ];
  $('#root').innerHTML = `
  <header>
    <div class="brand-box">
      <div class="brand-top">
        <img src="${LOGO_URL}" alt="大明高級中學校徽" onerror="this.style.display='none'">
        <p class="brand-note">內部使用・請勿外流</p>
      </div>
      <h1>大明高級中學</h1>
      <p class="en-title">TA-MING HIGH SCHOOL</p>
      <p class="sys-sub">招生活動管理系統</p>
    </div>
    <nav>${pages.map(([k, v]) => `<button class="${S.page === k ? 'on' : ''}" onclick="S.page='${k}';draw()">${v}</button>`).join('')}</nav>
    <div class="ft">
      登入者：<b style="color:#fff">${esc(S.userName || S.staffId)}</b><br>
      <button class="ft-btn" onclick="loadAll()">重新整理</button>
      <a href="${GUIDE_URL}" class="ft-btn">回招生手冊</a>
      <div class="ft-copy">本系統僅供校內招生同仁使用。<br>網頁相關問題與內容更新，請洽 #251 思婷</div>
    </div>
  </header>
  <main>
    <div class="sec">TA-MING ADMISSIONS</div>
    <h2 class="pt">${pages.find(x => x[0] === S.page)[1]}</h2>
    <div class="bar">
      <b>學年度</b>
      <select onchange="S.year=this.value;draw()">
        ${getYears().map(y => `<option value="${y}" ${String(S.year) === y ? 'selected' : ''}>${y} 學年度</option>`).join('')}
      </select>
    </div>
    <div id="content"></div>
  </main>`;
  $('#content').innerHTML = ({ home, cal, stats, manage, roster }[S.page])();
}

function home() {
  const as = yrActs().filter(a => !a.cx);
  const c = cnt();
  const tt = T.map((_, i) => as.filter(a => a.t === i).length);
  const mx = Math.max(1, ...tt);
  const people = as.reduce((s, a) => s + a.ac.length, 0);
  const actStaff = c.filter(x => x.total > 0).length;
  const top = [...c].filter(x => x.total > 0).sort((a, b) => b.total - a.total).slice(0, 10);

  return `
  <div class="grid">
    <div class="card"><div class="mu">活動總場次（不含取消）</div><div class="num">${as.length}</div></div>
    <div class="card"><div class="mu">實際參與總人次</div><div class="num">${people}</div></div>
    <div class="card"><div class="mu">參與教職員人數</div><div class="num">${actStaff} <span class="mu">/ ${S.staff.filter(p => p.on).length} 在職</span></div></div>
  </div>
  <div class="card">
    <b>各類型場次分布</b>
    ${T.map((t, i) => `<div class="row"><span class="l"><span class="dot" style="background:${t[1]}"></span>${t[0]}</span><div class="trk"><div class="fil" style="width:${tt[i] / mx * 100}%;background:${t[1]}"></div></div><span style="width:28px;text-align:right">${tt[i]}</span></div>`).join('')}
  </div>
  <div class="card">
    <b>參與次數排行榜（前 10 名）</b>
    ${top.map((p, i) => `<div class="row"><span class="l">${i + 1}. <span class="link" onclick="person('${esc(p.id)}')">${esc(p.name)}</span></span><div class="trk"><div class="fil" style="width:${p.total / Math.max(1, top[0].total) * 100}%;background:var(--navy)"></div></div><span style="width:28px;text-align:right">${p.total}</span></div>`).join('') || '<p class="mu">本學年度尚無實際出席紀錄</p>'}
  </div>`;
}

function cal() {
  const y = S.calY, m = S.m;
  const f = new Date(y, m, 1).getDay(), n = new Date(y, m + 1, 0).getDate();
  const ds = d => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  let h = `
  <div class="bar">
    <button class="btn" onclick="shiftMonth(-1)">◀</button>
    <b style="font-size:19px;min-width:120px;text-align:center">${y} 年 ${m + 1} 月</b>
    <button class="btn" onclick="shiftMonth(1)">▶</button>
    <button class="btn ${S.view === 'cal' ? 'pri' : ''}" onclick="S.view='cal';draw()">月曆</button>
    <button class="btn ${S.view === 'list' ? 'pri' : ''}" onclick="S.view='list';draw()">列表</button>
    <input id="aq" placeholder="搜尋活動名稱、類型或地點" style="min-width:240px" value="${esc(S.aq)}" oninput="S.aq=this.value;draw();focusEnd('#aq')">
  </div>
  <div class="card" style="padding:12px 16px">
    ${T.map(t => `<span style="margin-right:16px;font-size:14px;display:inline-block"><span class="dot" style="background:${t[1]}"></span>${t[0]}</span>`).join('')}
  </div>`;

  if (S.view === 'cal') {
    h += '<div class="card cal">' + '日一二三四五六'.split('').map(x => `<div class="h">${x}</div>`).join('') + '<div></div>'.repeat(f);
    for (let d = 1; d <= n; d++) {
      const list = yrActs().filter(a => a.date === ds(d) && fa(a));
      h += `<div class="d"><b>${d}</b>${list.map(a => `<span class="ev ${a.cx ? 'x' : ''}" style="background:${T[a.t]?.[1] || '#6b7280'}" onclick="evt('${esc(a.id)}')">${esc(a.name)}</span>`).join('')}</div>`;
    }
    h += '</div>';
  } else {
    const ym = `${y}-${String(m + 1).padStart(2, '0')}`;
    const list = yrActs().filter(a => a.date.startsWith(ym) && fa(a)).sort((a, b) => a.date.localeCompare(b.date));
    h += `<div class="card">${list.map(a => `<div class="row" style="cursor:pointer" onclick="evt('${esc(a.id)}')"><span class="tag" style="background:${T[a.t]?.[1] || '#6b7280'}">${T[a.t]?.[0] || '其他'}</span><span>${esc(a.date)} ${esc(a.time)} <b>${esc(a.name)}</b>（${esc(a.loc)}）${a.cx ? '【已取消】' : ''}</span></div>`).join('') || '<p class="mu">本月無活動</p>'}</div>`;
  }
  return h;
}

function shiftMonth(delta) {
  const d = new Date(S.calY, S.m + delta, 1);
  S.calY = d.getFullYear(); S.m = d.getMonth();
  draw();
}

function stats() {
  const q = S.q.toLowerCase();
  let c = cnt().filter(p =>
    p.name.toLowerCase().includes(q) ||
    p.id.toLowerCase().includes(q) ||
    p.dept.toLowerCase().includes(q) ||
    yrActs().some(a => !a.cx && a.ac.includes(p.id) && (a.name + a.loc + (T[a.t]?.[0] || '')).toLowerCase().includes(q))
  );
  c.sort((a, b) => S.sort === 'name' ? S.dir * a.name.localeCompare(b.name) :
    S.sort === 'dept' ? S.dir * a.dept.localeCompare(b.dept) :
    S.dir * ((S.sort === 'total' ? a.total - b.total : a.c[S.sort] - b.c[S.sort])));

  const th = (k, t, cl = '') => `<th class="${cl}" onclick="S.dir=S.sort==='${k}'?-S.dir:-1;S.sort='${k}';draw()">${t}${S.sort === k ? (S.dir < 0 ? ' ▼' : ' ▲') : ''}</th>`;
  return `
  <div class="bar">
    <input id="sq" placeholder="搜尋姓名、編號、處室或活動" style="min-width:240px" value="${esc(S.q)}" oninput="S.q=this.value;draw();focusEnd('#sq')">
    <button class="btn pri" onclick="exportStatsExcel()">匯出統計 Excel</button>
    <span class="mu">點欄位標題可排序；點姓名看個人明細</span>
  </div>
  <div class="card sc">
    <table>
      <tr>${th('name', '姓名')}${th('dept', '處室')}${T.map((t, i) => th(i, t[0], 'n')).join('')}${th('total', '總次數', 'n')}</tr>
      ${c.map(p => `<tr>
        <td><span class="link" onclick="person('${esc(p.id)}')">${esc(p.name)}</span>${p.on ? '' : ' <span class="mu">(停用)</span>'}</td>
        <td>${esc(p.dept)}</td>
        ${p.c.map(x => `<td class="n">${x}</td>`).join('')}
        <td class="n"><b>${p.total}</b></td>
      </tr>`).join('') || '<tr><td colspan="11" class="mu">尚無教職員資料，請先至「教職員名冊」匯入</td></tr>'}
    </table>
  </div>`;
}

function exportStatsExcel() {
  const rows = cnt().map(p => {
    const obj = { '教職員編號': p.id, '姓名': p.name, '處室': p.dept, '狀態': p.on ? '在職' : '停用' };
    T.forEach((t, i) => obj[t[0]] = p.c[i]);
    obj['總次數'] = p.total;
    return obj;
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, `${S.year}學年度統計`);
  XLSX.writeFile(wb, `大明高中_${S.year}學年度_教職員招生參與統計.xlsx`);
}

function manage() {
  const now = new Date();
  const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  const filtered = yrActs().filter(fa);
  const upcoming = filtered.filter(a => !a.cx && a.date >= today).sort((a, b) => a.date.localeCompare(b.date));
  const past = filtered.filter(a => a.cx || a.date < today).sort((a, b) => b.date.localeCompare(a.date));

  const tableHead = `<tr><th>日期</th><th>活動名稱</th><th>學校／地點</th><th class="n">班/人</th><th class="n">預計</th><th class="n">實際</th><th>狀態</th><th>操作</th></tr>`;
  const renderRows = (arr, emptyMsg) => arr.map(a => `<tr>
    <td>${esc(a.date)}</td>
    <td><span class="dot" style="background:${T[a.t]?.[1] || '#6b7280'}"></span>${esc(a.name)}</td>
    <td>${esc(a.loc)}</td>

function parseExcelDate(val) {
  if (!val) return '';
  if (typeof val === 'number') {
    const d = new Date(Math.round((val - 25569) * 86400 * 1000));
    return d.toISOString().slice(0, 10);
  }
  const s = String(val).trim().replace(/\//g, '-');
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  return s;
}

function matchStaffTokens(raw, unmatchedSet) {
  if (!raw) return [];
  const tokens = String(raw).split(/[、,，;；\/\n]+/).map(x => x.trim()).filter(Boolean);
  const ids = [];
  tokens.forEach(tk => {
    const clean = tk.replace(/\s+/g, '');
    const byId = S.staff.find(p => p.id === tk);
    if (byId) { if (!ids.includes(byId.id)) ids.push(byId.id); return; }
    const byName = S.staff.find(p => p.name === tk || p.name.replace(/\s+/g, '') === clean);
    if (byName) { if (!ids.includes(byName.id)) ids.push(byName.id); return; }
    unmatchedSet.add(tk);
  });
  return ids;
}

function handleImportActs(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const wb = XLSX.read(ev.target.result, { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      const unmatched = new Set();
      const list = rows.map(r => {
        const name = String(r['活動名稱'] || r['名稱'] || '').trim();
        const date = parseExcelDate(r['日期']);
        const typeStr = String(r['活動類型'] || r['類型'] || '').trim();
        let t = T.findIndex(x => x[0] === typeStr);
        if (t < 0) t = 7;
        const ac = matchStaffTokens(r['實際出席人員'] || r['實際出席'] || r['出席人員'] || '', unmatched);
        const pl = matchStaffTokens(r['預計參與人員'] || r['預計參與'] || '', unmatched);
        return {
          year: String(r['學年度'] || S.year).trim(),
          t, name, date,
          time: String(r['時間'] || '').trim(),
          loc: String(r['學校／地點'] || r['地點'] || r['學校'] || '').trim(),
          cls: Number(r['班級數']) || 0,
          ppl: Number(r['人數']) || 0,
          note: String(r['備註'] || '').trim(),
          pl, ac
        };
      }).filter(x => x.name && x.date);

      if (!list.length) return alert('找不到有效活動，請確認欄位包含「日期」與「活動名稱」');
      let msg = `即將匯入 ${list.length} 場招生活動。`;
      if (unmatched.size) {
        msg += `\n\n⚠ 以下 ${unmatched.size} 位人員在「教職員名冊」中找不到（將略過，請檢查是否打錯字）：\n` + [...unmatched].join('、');
      }
      msg += '\n\n確定要繼續匯入嗎？';
      if (!confirm(msg)) return;

      const data = await api('importActivities', { list });
      S.staff = data.staff; S.activities = data.activities;
      draw();
      alert(`匯入完成！共新增 ${list.length} 場活動。`);
    } catch (err) {
      alert('匯入失敗：' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}

function handleImport(e) {

    try {
      const wb = XLSX.read(ev.target.result, { type: 'array' });

      const list = rows.map(r => ({
        id: r['教職員編號'] || r['編號'] || r['員工編號'] || r['id'] || '',
        name: r['姓名'] || r['name'] || '',

      })).filter(x => x.id && x.name);

      if (!confirm(`即將匯入 ${list.length} 筆教職員資料（相同編號將自動更新），確定繼續？`)) return;
      const data = await api('importStaff', { list });

      draw();
      alert('匯入完成！');
    } catch (err) {
      alert('匯入失敗：' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}

async function submitAct(e, id, cx) {

      date: $('#fd').value, time: $('#fti').value.trim(), loc: $('#fl').value.trim(),

      <button class="btn sm" onclick="tempPl.forEach(x=>tempAc.add(x));renderAttModal($('#attq').value)">將預計名單全勾為實際</button>

    <div class="sc" style="max-height:46vh">
      <table>

async function submitStaff(e, on) {

    S.staff = data.staff; S.activities = data.activities;

async function toggleStaff(id) {
  const p = S.staff.find(x => x.id === id);
  if (!confirm(`確定要${p.on ? '停用' : '啟用'}「${p.name}」嗎？`)) return;
  try {
    const data = await api('saveStaff', { ...p, on: !p.on });
    S.staff = data.staff; S.activities = data.activities;
    draw();
  } catch (err) { alert('更新失敗：' + err.message); }
}
